<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vastram By Deva</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap');

:root{
  --maroon:#6E2C1A;
  --deep:#4A1C12;
  --gold:#C8A24D;
  --cream:#F9F3EC;
}

/* ===== BACKGROUND ===== */
body{
  margin:0;
  font-family:'Poppins', sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#6E2C1A,#4A1C12);
  overflow:hidden;
  position:relative;
}

/* Saree watermark left */
body::before{
  content:"";
  position:absolute;
  left:40px;
  top:50%;
  width:350px;
  height:350px;
  background:url('assets/Vastram_logo.png') no-repeat center;
  background-size:contain;
  opacity:.05;
  transform:translateY(-50%);
}

/* Saree watermark right */
body::after{
  content:"";
  position:absolute;
  right:40px;
  top:50%;
  width:350px;
  height:350px;
  background:url('assets/Vastram_logo.png') no-repeat center;
  background-size:contain;
  opacity:.05;
  transform:translateY(-50%);
}

/* Silk wave animation */
.silk-wave{
  position:absolute;
  width:100%;
  height:300px;
  bottom:0;
  background: radial-gradient(circle at 50% 100%, rgba(200,162,77,.25), transparent 60%);
  animation:waveMove 6s ease-in-out infinite alternate;
}

@keyframes waveMove{
  0%{ transform:translateY(0);}
  100%{ transform:translateY(20px);}
}

/* Gold sparkles */
.sparkle{
  position:absolute;
  width:6px;
  height:6px;
  background:var(--gold);
  border-radius:50%;
  box-shadow:0 0 10px var(--gold);
  animation:sparkleAnim 4s infinite ease-in-out;
  opacity:.7;
}

@keyframes sparkleAnim{
  0%{ transform:translateY(0) scale(.5);}
  50%{ transform:translateY(-30px) scale(1);}
  100%{ transform:translateY(0) scale(.5);}
}

/* ===== LOGIN CARD ===== */
.login-card{
  width:380px;
  padding:35px 35px;   /* reduced from 45–60px */
  border-radius:28px;
  background:var(--cream);
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  text-align:center;
  position:relative;
  animation:royalEntry 1.1s ease;
}

/* Royal entrance animation */
@keyframes royalEntry{
  0%{opacity:0; transform:scale(.9) translateY(50px);}
  100%{opacity:1; transform:scale(1) translateY(0);}
}

/* Gold glow border */
.login-card::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:34px;
  background: linear-gradient(120deg, var(--gold), transparent, var(--gold));
  filter:blur(6px);
  opacity:.8;
  z-index:-1;
  animation:borderGlow 3s linear infinite;
}

@keyframes borderGlow{
  0%{ background-position:200% 0;}
  100%{ background-position:-200% 0;}
}

/* ===== LOGO ===== */
.logo{
  width:160px;      /* Bigger */
  margin-bottom:8px;  /* Reduced spacing */
  margin-top:-10px;   /* Pull upward */
  display:block;
  margin-left:auto;
  margin-right:auto;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,.25));
}

/* ===== HEADING ===== */
h2{
  font-family:'Playfair Display', serif;
  font-size:26px;     /* reduced */
  font-weight:700;
  color:var(--maroon);
  margin-bottom:5px;
}

/* Animated gold underline */
.brand-line{
  font-size:13px;
  margin-bottom:20px;  /* reduced spacing */
}

.brand-line::after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:-8px;
  width:60px;
  height:3px;
  background:var(--gold);
  border-radius:5px;
  animation:underlineGlow 2s infinite alternate;
}

@keyframes underlineGlow{
  0%{ width:40px;}
  100%{ width:80px;}
}

/* ===== INPUTS ===== */
input{
  width:90%;
  padding:12px;        /* reduced from 14–16px */
  margin-bottom:12px;  /* tighter spacing */
  border-radius:12px;
  font-size:13px;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(200,162,77,.2);
  outline:none;
}

.remember{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin:12px 0 20px;
  font-size:14px;
  color:#6E2C1A;   /* same brand color */
}

.remember input{
  width:16px;
  height:16px;
  accent-color:#6E2C1A;  /* brand checkbox color */
}

.remember label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  cursor:pointer;
}

/* Button */
button{
  width:50%;
  padding:14px;
  border:none;
  border-radius:18px;
  font-size:14px;
  font-weight:600;
  background:#6E2C1A;   /* same brand color */
  color:white;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
}

button:hover{
  background:#4A1C12;
  transform:translateY(-3px);
}

.footer{
  margin-top:10px;
  font-size:10px;
}
.password-wrapper{
  position:relative;
}

.password-wrapper input{
  padding-right:12px; /* space for show text */
}

.toggle-link{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  font-weight:500;
  color:#6E2C1A;   /* same as brand */
  cursor:pointer;
  transition:.2s;
}

.toggle-link:hover{
  text-decoration:underline;
  color:#4A1C12;
}

.spinner{
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,0.4);
  border-top:3px solid white;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  display:none;
  margin-left:10px;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

#loginBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}


</style>
</head>

<body>

<div class="floating-fabric"></div>
<div class="silk-wave"></div>

<div class="sparkle" style="top:30%; left:20%;"></div>
<div class="sparkle" style="top:40%; right:25%; animation-delay:1s;"></div>
<div class="sparkle" style="top:60%; left:30%; animation-delay:2s;"></div>

<div class="login-card" id="card">

  <img src="assets/Vastram_logo.png" class="logo">

  <h2>Vastram By Deva</h2>
  <div class="brand-line">
    Elegant • Traditional • Premium • Feminine • Royal
  </div>

  <input type="email" id="email" placeholder="Email">

<div class="password-wrapper">
  <input type="password" id="password" placeholder="Password">
  <span class="toggle-link" id="togglePass">Show</span>
</div>

<div class="remember">
  <input type="checkbox" id="remember">
  <label for="remember">Remember me</label>
</div>

  <button id="loginBtn">
    <span id="btnText">Login</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="footer">© 2026 Vastram By Deva</div>

</div>

<script type="module">

// Firebase imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAY_oTerSMIF8FYoKyyFIokX-jadXqEtb0",
  authDomain: "vastrambydeva-fa343.firebaseapp.com",
  projectId: "vastrambydeva-fa343",
  storageBucket: "vastrambydeva-fa343.firebasestorage.app",
  messagingSenderId: "988690580826",
  appId: "1:988690580826:web:b447539adcca2032d89f63"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginBtn = document.getElementById("loginBtn");
const spinner = document.getElementById("spinner");
const btnText = document.getElementById("btnText");

loginBtn.addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    alert("Please enter email & password ❗");
    return;
  }

  spinner.style.display = "inline-block";
  btnText.innerText = "Signing In...";
  loginBtn.disabled = true;

  try {

    const result = await signInWithEmailAndPassword(auth, email, password);

    console.log("User logged in:", result.user);

    btnText.innerText = "Success 👑";

    setTimeout(()=>{
      window.location.href = "dashboard.html";
    }, 1000);

  } catch(error){

    spinner.style.display = "none";
    btnText.innerText = "Login";
    loginBtn.disabled = false;

    alert("Login Failed ❌\n" + error.message);
  }

});

/* ===== SHOW / HIDE PASSWORD ===== */

const togglePass = document.getElementById("togglePass");
const passwordInput = document.getElementById("password");

togglePass.addEventListener("click", () => {

  if(passwordInput.type === "password"){
    passwordInput.type = "text";
    togglePass.innerText = "Hide";
  } else {
    passwordInput.type = "password";
    togglePass.innerText = "Show";
  }

});

</script>

</body>
</html>
