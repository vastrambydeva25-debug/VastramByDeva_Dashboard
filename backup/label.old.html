<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shipping Label</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  padding:20px;
  background:white;
}

.label-container{
  width:380px;
  border:2px solid #000;
  padding:20px;
}

.logo{
  width:130px;
  margin-bottom:10px;
}

.brand-name{
  font-weight:bold;
  font-size:16px;
  margin-bottom:15px;
}

.section{
  margin-bottom:12px;
}

.section-title{
  font-weight:bold;
  border-bottom:1px solid #ccc;
  margin-bottom:5px;
  padding-bottom:3px;
}

p{
  margin:4px 0;
  font-size:14px;
}

.order-id{
  font-size:14px;
  font-weight:bold;
  background:#f2f2f2;
  padding:5px;
  margin-bottom:10px;
}

.print-btn{
  margin-top:20px;
  padding:8px 15px;
  background:black;
  color:white;
  border:none;
  cursor:pointer;
}

@media print{
  .print-btn{
    display:none;
  }
}
</style>
</head>

<body>

<div class="label-container">

  <img src="assets/Vastram_logo.png" class="logo">
  <div class="brand-name">Vastram By Deva</div>

  <div class="order-id">
    🆔 Order ID: <span id="orderId"></span>
  </div>

  <div class="section">
    <div class="section-title">📦 Shipping To</div>

    <p><strong>Name:</strong> <span id="customer"></span></p>
    <p><strong>Phone:</strong> <span id="contact"></span></p>

    <p><strong>Address:</strong></p>
    <div id="address" style="line-height:1.4;"></div>
  </div>

  <div class="section">
    <div class="section-title">🚚 Courier Details</div>
    <p><strong>Courier:</strong> <span id="courier"></span></p>
    <p><strong>Tracking:</strong> <span id="tracking"></span></p>
  </div>

  <button class="print-btn" onclick="window.print()">Print Label</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const index = params.get("index");

const orders = JSON.parse(localStorage.getItem("orders") || "[]");
const order = orders[index];

if(order){

  document.getElementById("orderId").innerText = order.orderId || "-";
  document.getElementById("customer").innerText = order.customer || "-";
  document.getElementById("contact").innerText = order.contact || "-";
  document.getElementById("courier").innerText = order.courier || "-";
  document.getElementById("tracking").innerText = order.tracking || "-";

  // Proper formatted address
  const addressParts = [
    order.addressLine1,
    order.addressLine2,
    order.city && order.pincode ? order.city + " - " + order.pincode : "",
    order.state
  ].filter(Boolean);   // removes empty values

  document.getElementById("address").innerHTML = addressParts.join("<br>");

}

</script>

</body>
</html>
